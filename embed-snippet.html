<!-- ElectricAce EV Charger Questionnaire — paste this into your Marblism site
     (custom code / HTML embed block). Homeowner EV charger questionnaire.
     The questionnaire lives on GitHub Pages; edit it on GitHub and the site updates automatically. -->
<div id="ea-ev-wrap" style="max-width:860px;margin:0 auto;">
  <iframe
    id="ea-ev-frame"
    src="https://nherron2323.github.io/hankisadog/ev/"
    title="EV Charger Questionnaire — ElectricAce"
    style="width:100%;height:1400px;border:0;display:block;"
    loading="lazy"
    allow="clipboard-write"
  ></iframe>
</div>
<script>
  // Resizes the iframe to fit the questionnaire so there's no inner scrollbar.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'ea-ev-height') return;
    if (e.origin.indexOf('github.io') === -1) return;
    var f = document.getElementById('ea-ev-frame');
    if (f) f.style.height = (e.data.height + 20) + 'px';
  });
</script>
