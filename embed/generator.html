<!-- Generator Sizing Questionnaire — ElectricAce -- paste into a custom code / HTML embed block on the generator page of electricace.com.
     The form is hosted on GitHub Pages; edit it on GitHub and the site updates automatically. -->
<div style="max-width:860px;margin:0 auto;">
  <iframe id="ea-gen-frame" src="https://nherron2323.github.io/ev-questionnaire/generator/"
    title="Generator Sizing Questionnaire — ElectricAce" style="width:100%;height:1400px;border:0;display:block;" loading="lazy"></iframe>
</div>
<script>
(function () {
  var f = document.getElementById('ea-gen-frame');
  window.addEventListener('message', function (e) {
    if (!f || e.source !== f.contentWindow || !e.data || typeof e.data.type !== 'string') return;
    var t = e.data.type.replace(/^ea-(ev|form)-/, '');
    var frameTop = f.getBoundingClientRect().top + window.pageYOffset;
    if (t === 'height') f.style.height = (e.data.height + 20) + 'px';
    else if (t === 'top') window.scrollTo({ top: frameTop - 80, behavior: 'smooth' });
    else if (t === 'scroll') window.scrollTo({ top: frameTop + e.data.offset - 80, behavior: 'smooth' });
  });
})();
</script>
